<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathPilot - Student Onboarding</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f5f5f5; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #34495e; }
        input[type="text"], input[type="email"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        button { background-color: #3498db; color: white; padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; transition: background 0.3s; }
        button:hover { background-color: #2980b9; }
        #loading { display: none; text-align: center; margin-top: 20px; color: #7f8c8d; }
        #questions-section { display: none; margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
        .question-card { background: #f9f9f9; padding: 15px; margin-bottom: 15px; border-radius: 5px; border-left: 4px solid #3498db; }
        textarea { width: 100%; height: 80px; margin-top: 10px; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .success-message { display: none; background: #dff0d8; color: #3c763d; padding: 15px; border-radius: 5px; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>PathPilot Onboarding</h1>
        
        <!-- Step 1: Upload Resume -->
        <div id="step-1">
            <form id="uploadForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Upload Resume (PDF)</label>
                    <input type="file" id="resume" accept=".pdf" required>
                </div>
                <button type="submit">Start Onboarding</button>
            </form>
        </div>

        <!-- Loading Indicator -->
        <div id="loading">
            <p>Analyzing your resume with AI... Please wait...</p>
            <progress></progress>
        </div>

        <!-- Step 2: Answer Questions -->
        <div id="questions-section">
            <h2>Personalized Questions</h2>
            <p>Based on your profile, please answer the following:</p>
            <form id="answersForm">
                <input type="hidden" id="studentId">
                <div id="questions-list"></div>
                <button type="submit">Submit Answers</button>
            </form>
        </div>

        <!-- Success Message -->
        <div id="success-msg" class="success-message">
            <h3>🎉 You're all set!</h3>
            <p>Your profile has been created and answers saved.</p>
        </div>
    </div>

    <script>
        const uploadForm = document.getElementById('uploadForm');
        const answersForm = document.getElementById('answersForm');
        const loading = document.getElementById('loading');
        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('questions-section');
        const successMsg = document.getElementById('success-msg');

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Show loading
            step1.style.display = 'none';
            loading.style.display = 'block';

            const formData = new FormData();
            formData.append('name', document.getElementById('name').value);
            formData.append('email', document.getElementById('email').value);
            formData.append('resume', document.getElementById('resume').files[0]);

            try {
                const response = await fetch('/api/onboarding', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    loading.style.display = 'none';
                    step2.style.display = 'block';
                    
                    document.getElementById('studentId').value = data.student_id;
                    
                    const list = document.getElementById('questions-list');
                    data.questions.forEach((q, index) => {
                        const div = document.createElement('div');
                        div.className = 'question-card';
                        div.innerHTML = `
                            <strong>Q${index + 1}: ${q.question}</strong>
                            <textarea name="answer_${q.id}" required placeholder="Type your answer here..."></textarea>
                        `;
                        list.appendChild(div);
                    });
                } else {
                    alert('Error: ' + data.error);
                    loading.style.display = 'none';
                    step1.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                alert('An error occurred. Check console.');
            }
        });

        answersForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const studentId = document.getElementById('studentId').value;
            const answers = [];
            
            const textareas = document.querySelectorAll('textarea');
            textareas.forEach(t => {
                const qId = t.name.replace('answer_', '');
                answers.push({
                    question_id: qId,
                    answer: t.value
                });
            });

            try {
                const response = await fetch('/api/onboarding/answers', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        student_id: studentId,
                        answers: answers
                    })
                });

                if (response.ok) {
                    step2.style.display = 'none';
                    successMsg.style.display = 'block';
                } else {
                    alert('Failed to save answers.');
                }
            } catch (err) {
                console.error(err);
                alert('Error submitting answers.');
            }
        });
    </script>
</body>
</html>
